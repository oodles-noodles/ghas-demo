name: "Dependency Review"

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # Block PRs that introduce dependencies with known critical or high vulnerabilities
          fail-on-severity: moderate
          # Also block PRs that introduce packages with restrictive licenses
          deny-licenses: GPL-3.0, AGPL-3.0
          # Comment a summary on the PR
          comment-summary-in-pr: always
